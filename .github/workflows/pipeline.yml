name: pipeline

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_pipeline:
        description: "After deploying, run the full ML pipeline once and wait for it (~25 min, incurs SageMaker cost)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AWS_REGION: us-east-1
  CDK_VERSION: "2.1143.0"
  STACK: HpvMlopsStackV2

jobs:
  # ---------------------------------------------------------------------------
  # 1. Lint + tests. No AWS credentials needed: AWS is mocked with moto.
  # ---------------------------------------------------------------------------
  test:
    name: Lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q

  # ---------------------------------------------------------------------------
  # 2. Build everything from source and synthesize the CloudFormation template.
  #    Also proves the Docker-free Lambda packaging works, on every PR.
  # ---------------------------------------------------------------------------
  synth:
    name: Build & synth
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            cdk/requirements.txt
            api/requirements-lambda.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install CDK
        run: |
          npm install -g "aws-cdk@${CDK_VERSION}"
          pip install -r cdk/requirements.txt
      - name: Build deploy assets from source
        run: ./scripts/build_assets.sh
      - name: Build and import-test the API Lambda package
        run: |
          pip install boto3   # provided by the Lambda runtime; needed here only for the import check
          ./scripts/build_lambda_package.sh
      - name: Synthesize
        working-directory: cdk
        run: cdk synth --quiet
      # Build once, deploy exactly what was tested.
      - name: Upload synthesized assembly
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: cdk-out
          path: cdk/cdk.out
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 3. Plan: show exactly what would change, BEFORE anyone approves the deploy.
  # ---------------------------------------------------------------------------
  plan:
    name: Plan (cdk diff)
    if: github.event_name != 'pull_request'
    needs: [test, synth]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install CDK
        run: npm install -g "aws-cdk@${CDK_VERSION}"
      - uses: actions/download-artifact@v4
        with:
          name: cdk-out
          path: cdk.out
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: cdk diff
        shell: bash
        run: |
          cdk diff --app cdk.out "$STACK" 2>&1 | tee diff.txt
          {
            echo '### cdk diff'
            echo '```'
            cat diff.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # 4. Deploy, gated by the "production" environment (required reviewers), then
  #    smoke-test what was deployed. CloudFormation rolls a failed deploy back
  #    automatically; to undo a good deploy, revert the commit and this reruns.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy (manual approval)
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install CDK
        run: npm install -g "aws-cdk@${CDK_VERSION}"
      - uses: actions/download-artifact@v4
        with:
          name: cdk-out
          path: cdk.out
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      # The plan was reviewed at the approval gate, hence no second prompt here.
      - name: Deploy
        run: cdk deploy --app cdk.out --require-approval never --outputs-file cdk-outputs.json "$STACK"
      - name: Smoke test - API Lambda imports and answers /health
        shell: bash
        run: |
          FN=$(jq -r --arg s "$STACK" '.[$s].ApiFunctionName' cdk-outputs.json)
          aws lambda invoke --function-name "$FN" --cli-binary-format raw-in-base64-out \
            --payload file://tests/events/health.json health-response.json > /dev/null
          cat health-response.json; echo
          python3 - <<'PY'
          import json
          r = json.load(open("health-response.json"))
          assert r.get("statusCode") == 200, f"unexpected response: {r}"
          assert json.loads(r["body"]) == {"status": "ok"}, r
          print("API Lambda smoke test passed")
          PY
      - name: Run the full ML pipeline once (optional)
        if: github.event_name == 'workflow_dispatch' && inputs.run_pipeline
        shell: bash
        run: |
          ARN=$(jq -r --arg s "$STACK" '.[$s].StateMachineArn' cdk-outputs.json)
          EXEC=$(aws stepfunctions start-execution --state-machine-arn "$ARN" \
            --name "ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --input '{"retrain_requested": true}' --query executionArn --output text)
          echo "Started $EXEC"
          STATUS=RUNNING
          for i in $(seq 1 90); do
            STATUS=$(aws stepfunctions describe-execution --execution-arn "$EXEC" --query status --output text)
            echo "[$i/90] $STATUS"
            if [ "$STATUS" != "RUNNING" ]; then break; fi
            sleep 30
          done
          test "$STATUS" = "SUCCEEDED"
